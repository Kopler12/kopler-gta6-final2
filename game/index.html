<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAN VERANO: Neon Coast 3D — an original open-world crime game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e18;
    font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #game, #game canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #wanted { font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 8px #000; }
  #wanted .star { color: rgba(255,255,255,0.25); }
  #wanted .star.on { color: #ffd700; text-shadow: 0 0 10px #ff8800; }
  #cash { font-size: 30px; font-weight: 800; color: #37d67a; text-shadow: 0 2px 6px #000; margin-top: 2px; }
  #clock { font-size: 16px; color: #ffe9a8; text-shadow: 0 1px 4px #000; }
  #hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; background: rgba(10,14,24,0.6); border: 1px solid rgba(255,214,0,0.5);
    border-radius: 8px; padding: 8px 18px; max-width: 520px; }
  #mission-title { display: block; font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #ffd600; }
  #mission-text { display: block; font-size: 15px; margin-top: 2px; }
  #hud-bottom-left { position: absolute; left: 16px; bottom: 16px; }
  #health-wrap { width: 220px; height: 18px; background: rgba(0,0,0,0.6); border: 1px solid #fff3;
    border-radius: 9px; position: relative; overflow: hidden; }
  #health-bar { height: 100%; width: 100%; background: #37d67a; border-radius: 9px; }
  #health-text { position: absolute; right: 8px; top: 0; font-size: 12px; line-height: 18px; font-weight: 700; }
  #ammo { margin-top: 6px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  #hud-bottom-right { position: absolute; right: 16px; bottom: 16px; text-align: right; }
  #speed { font-size: 44px; font-weight: 800; line-height: 1; text-shadow: 0 2px 8px #000; }
  #speed-unit { font-size: 13px; letter-spacing: 2px; color: #ffe9a8; }
  #car-hint { margin-top: 6px; font-size: 14px; color: #fff; text-shadow: 0 1px 4px #000; }
  #minimap { position: absolute; right: 16px; top: 14px; border-radius: 8px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.35), 0 4px 14px rgba(0,0,0,0.6); }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; color: #fff; text-shadow: 0 0 6px #000; display: none; }
  #toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(10,14,24,0.75); border: 1px solid rgba(255,255,255,0.35); border-radius: 8px;
    padding: 10px 20px; font-size: 16px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #center-msg { position: absolute; left: 50%; top: 34%; transform: translateX(-50%);
    font-size: 30px; font-weight: 800; letter-spacing: 1px; color: #ffd600;
    text-shadow: 0 0 18px #ff8800, 0 2px 6px #000; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; }
  #menu, #pause, #gameover { position: fixed; inset: 0; display: none; z-index: 10;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(20,8,40,0.82), rgba(255,110,60,0.55)); }
  #menu { display: flex; }
  .menu-card { max-width: 620px; margin: 20px; padding: 34px 40px; text-align: center;
    background: rgba(10,14,24,0.88); border: 1px solid rgba(255,45,149,0.6); border-radius: 16px;
    box-shadow: 0 0 60px rgba(255,45,149,0.35); }
  .menu-card h1 { font-size: 54px; letter-spacing: 4px; color: #ff2d95;
    text-shadow: 0 0 24px rgba(255,45,149,0.8); }
  .menu-card h2 { font-size: 22px; letter-spacing: 8px; color: #00e5ff; margin: 4px 0 16px; }
  .menu-card .story { font-size: 16px; line-height: 1.55; color: #e8e8f0; }
  .menu-card .controls { font-size: 14px; line-height: 1.8; color: #c8ccd4; margin: 16px 0; }
  .menu-card button { pointer-events: auto; cursor: pointer; font-size: 17px; font-weight: 800;
    letter-spacing: 1px; color: #0a0e18; background: #ffd600; border: none; border-radius: 10px;
    padding: 13px 26px; margin: 6px; }
  .menu-card button:hover { background: #ffe14d; }
  .menu-card .foot { font-size: 12px; color: #9aa0aa; margin-top: 14px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
